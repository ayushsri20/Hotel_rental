{% extends 'base.html' %}
{% load static %}

{% block title %}Analytics Hub - Panesar PG
<script>
  // Real-Time Dashboard Metrics Auto-Refresh
  let refreshInterval;
  let lastUpdated = new Date();

  function formatTimestamp(isoString) {
    const date = new Date(isoString);
    const now = new Date();
    const diffSeconds = Math.floor((now - date) / 1000);
    if (diffSeconds < 5) return 'Just now';
    if (diffSeconds < 60) return `${diffSeconds}s ago`;
    if (diffSeconds < 3600) return `${Math.floor(diffSeconds / 60)}m ago`;
    return date.toLocaleTimeString();
  }

  async function refreshMetrics() {
    try {
      const response = await fetch('/api/dashboard/metrics/');
      const data = await response.json();
      if (data.success) {
        const m = data.metrics;
        updateValue('expected-yield', '₹' + m.expected_yield.toLocaleString('en-IN', {maximumFractionDigits: 0}));
        updateValue('realized-revenue', '₹' + m.realized_revenue.toLocaleString('en-IN', {maximumFractionDigits: 0}));
        updateValue('accounts-receivable', '₹' + m.accounts_receivable.toLocaleString('en-IN', {maximumFractionDigits: 0}));
        updateValue('efficiency', m.collection_efficiency.toFixed(1) + '%');
        updateValue('occupancy', m.occupancy_rate.toFixed(0) + '%');
        lastUpdated = new Date(data.meta.last_updated);
        updateTimestamp();
        console.log('✓ Dashboard metrics refreshed');
      }
    } catch (error) {
      console.error('Error refreshing metrics:', error);
    }
  }

  function updateValue(id, newValue) {
    const el = document.getElementById(id);
    if (el && el.textContent !== newValue) {
      el.style.transition = 'background-color 0.3s';
      el.style.backgroundColor = 'rgba(34, 197, 94, 0.1)';
      el.textContent = newValue;
      setTimeout(() => { el.style.backgroundColor = ''; }, 300);
    }
  }

  function updateTimestamp() {
    const el = document.getElementById('last-updated');
    if (el) el.textContent = formatTimestamp(lastUpdated.toISOString());
  }

  function startAutoRefresh() {
    refreshMetrics();
    refreshInterval = setInterval(refreshMetrics, 5000);
    setInterval(updateTimestamp, 1000);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearInterval(refreshInterval);
      console.log('⏸ Dashboard refresh paused');
    } else {
      console.log('▶ Dashboard refresh resumed');
      refreshMetrics();
      refreshInterval = setInterval(refreshMetrics, 5000);
    }
  });

  document.addEventListener('DOMContentLoaded', startAutoRefresh);
</script>

{% endblock %}
